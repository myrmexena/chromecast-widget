<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromecast Widget</title>
<style>
  :root { --bg:#111; --fg:#f2f2f2; --muted:#999; --accent:#4f8cff; --card:#1c1c1e; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f4f6; --fg:#111; --muted:#666; --card:#fff; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px system-ui,sans-serif; background:var(--bg); color:var(--fg);
         display:flex; justify-content:center; padding:16px; }
  .card { width:100%; max-width:360px; background:var(--card); border-radius:16px; padding:16px; }
  select { width:100%; padding:6px; margin-bottom:12px; border-radius:8px; }
  .now { display:flex; gap:12px; align-items:center; min-height:72px; }
  .now img { width:72px; height:72px; border-radius:8px; object-fit:cover; background:#333; }
  .title { font-weight:600; } .sub { color:var(--muted); font-size:13px; }
  .bar { height:4px; background:#444; border-radius:2px; margin:14px 0 4px; }
  .bar > div { height:100%; width:0; background:var(--accent); border-radius:2px; }
  .time { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
  .controls { display:flex; justify-content:center; gap:10px; margin-top:12px; }
  .controls { align-items:center; gap:14px; }
  button { border:0; padding:0; cursor:pointer; background:none; color:var(--fg);
           display:grid; place-items:center; border-radius:50%;
           transition:transform .12s, background .12s, color .12s, opacity .12s; }
  button:active { transform:scale(.92); }
  button svg { display:block; }
  .skip { width:52px; height:52px; opacity:.85; }
  .skip:hover { opacity:1; background:color-mix(in srgb, var(--accent) 18%, transparent); color:var(--accent); }
  .play { width:64px; height:64px; background:var(--accent); color:#fff;
          box-shadow:0 4px 14px color-mix(in srgb, var(--accent) 45%, transparent); }
  .play:hover { transform:scale(1.06); }
  .stop { width:40px; height:40px; background:color-mix(in srgb, #e5484d 15%, transparent); color:#e5484d; }
  .stop:hover { background:#e5484d; color:#fff; }
  .vol { display:flex; align-items:center; gap:10px; margin-top:14px; }
  .mute { width:32px; height:32px; opacity:.8; flex:none; }
  .mute:hover { opacity:1; color:var(--accent); }
  input[type=range] { flex:1; accent-color:var(--accent); height:4px; cursor:pointer; }
  #volv { width:34px; text-align:right; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  #err { color:#e5484d; font-size:13px; margin-top:8px; min-height:1em; }
</style>
</head>
<body>
<div class="card">
  <select id="device"></select>
  <div class="now">
    <img id="img" alt="">
    <div><div class="title" id="title">—</div><div class="sub" id="sub"></div></div>
  </div>
  <div class="bar"><div id="fill"></div></div>
  <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="controls">
    <button class="skip" data-a="seek" data-d="-30" title="Reculer de 30 s" aria-label="Reculer de 30 secondes">
      <svg width="40" height="40" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <g><path d="M 6.47 11.5 A 11 11 0 1 0 16 6"/><path d="M 11.2 6 L 17.6 2.4 L 17.6 9.6 Z" fill="currentColor"/></g>
        <text x="16" y="21" text-anchor="middle" font-size="9.5" font-weight="700" font-family="system-ui,sans-serif" fill="currentColor" stroke="none">30</text>
      </svg></button>
    <button class="play" data-a="toggle" id="pp" title="Pause / lecture" aria-label="Pause / lecture"></button>
    <button class="skip" data-a="seek" data-d="30" title="Avancer de 30 s" aria-label="Avancer de 30 secondes">
      <svg width="40" height="40" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <g transform="translate(32 0) scale(-1 1)"><path d="M 6.47 11.5 A 11 11 0 1 0 16 6"/><path d="M 11.2 6 L 17.6 2.4 L 17.6 9.6 Z" fill="currentColor"/></g>
        <text x="16" y="21" text-anchor="middle" font-size="9.5" font-weight="700" font-family="system-ui,sans-serif" fill="currentColor" stroke="none">30</text>
      </svg></button>
    <button class="stop" data-a="stop" title="Arrêter la diffusion" aria-label="Arrêter la diffusion">
      <svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="3" fill="currentColor"/></svg></button>
  </div>
  <div class="vol">
    <button class="mute" id="mute" data-a="mute" title="Muet" aria-label="Muet"></button>
    <input type="range" id="vol" min="0" max="100" value="50" aria-label="Volume">
    <span id="volv">50%</span>
  </div>
  <div id="err"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s/3600),
  m = Math.floor(s%3600/60), x = String(s%60).padStart(2,"0");
  return h ? `${h}:${String(m).padStart(2,"0")}:${x}` : `${m}:${x}`; };
const ICON = {
  play:  '<svg width="28" height="28" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z" fill="currentColor"/></svg>',
  pause: '<svg width="28" height="28" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/></svg>',
};
const SPK = (muted, v) => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z" fill="currentColor"/>${
  muted || v === 0 ? '<path d="M16 9.5l5 5M21 9.5l-5 5"/>' : (v > 0.5 ? '<path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/>' : '<path d="M15.5 9a4 4 0 0 1 0 6"/>')}</svg>`;
let dragging = false, volTimer = null;
const showVol = (v, muted) => {
  if (!dragging && v != null) { $("vol").value = Math.round(v * 100); $("volv").textContent = Math.round(v * 100) + "%"; }
  $("mute").innerHTML = SPK(muted, v ?? $("vol").value / 100);
};
$("vol").addEventListener("pointerdown", () => dragging = true);
$("vol").addEventListener("pointerup", () => setTimeout(() => dragging = false, 600));
$("vol").addEventListener("input", () => {
  const v = $("vol").value / 100; $("volv").textContent = $("vol").value + "%"; $("mute").innerHTML = SPK(false, v);
  clearTimeout(volTimer);
  volTimer = setTimeout(() => api(`/api/action?device=${dev()}&action=volume&level=${v}`, {method:"POST"})
    .catch(e => $("err").textContent = e.message), 120);
});
showVol(0.5, false);
const setPlaying = p => { $("pp").innerHTML = p ? ICON.pause : ICON.play; };
setPlaying(false);
const dev = () => encodeURIComponent($("device").value);

async function api(path, opts) {
  const r = await fetch(path, opts); const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
async function loadDevices() {
  try {
    const list = await api("/api/devices");
    const sel = $("device").value;
    if (JSON.stringify(list) !== JSON.stringify([...$("device").options].map(o => o.value))) {
      $("device").innerHTML = list.map(n => `<option>${n}</option>`).join("");
      if (list.includes(sel)) $("device").value = sel;
    }
    $("err").textContent = list.length ? "" : "Recherche des Chromecast…";
  } catch (e) { $("err").textContent = e.message; }
}
async function refresh() {
  if (!$("device").value) { await loadDevices(); if (!$("device").value) return; }
  try {
    const s = await api(`/api/status?device=${dev()}`);
    $("title").textContent = s.title || s.app || "Rien en cours de diffusion";
    $("sub").textContent = [s.artist, s.app, s.state].filter(Boolean).join(" · ");
    $("img").style.visibility = s.image ? "visible" : "hidden"; if (s.image) $("img").src = s.image;
    setPlaying(s.state === "PLAYING"); showVol(s.volume, s.muted);
    $("cur").textContent = fmt(s.current); $("dur").textContent = fmt(s.duration);
    $("fill").style.width = s.duration ? `${100 * s.current / s.duration}%` : "0";
    $("err").textContent = "";
  } catch (e) { $("err").textContent = e.message; }
}
document.querySelectorAll("button").forEach(b => b.onclick = async () => {
  try {
    await api(`/api/action?device=${dev()}&action=${b.dataset.a}&delta=${b.dataset.d || 0}`, {method:"POST"});
    setTimeout(refresh, 500);
  } catch (e) { $("err").textContent = e.message; }
});
loadDevices().then(refresh); setInterval(refresh, 2000);
</script>
</body>
</html>
