<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromecast Widget</title>
<style>
  :root { --bg:#111; --fg:#f2f2f2; --muted:#999; --accent:#4f8cff; --card:#1c1c1e; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f4f6; --fg:#111; --muted:#666; --card:#fff; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px system-ui,sans-serif; background:var(--bg); color:var(--fg);
         display:flex; justify-content:center; padding:16px; }
  .card { width:100%; max-width:360px; background:var(--card); border-radius:16px; padding:16px; }
  select { width:100%; padding:6px; margin-bottom:12px; border-radius:8px; }
  .now { display:flex; gap:12px; align-items:center; min-height:72px; }
  .now img { width:72px; height:72px; border-radius:8px; object-fit:cover; background:#333; }
  .title { font-weight:600; } .sub { color:var(--muted); font-size:13px; }
  .bar { height:4px; background:#444; border-radius:2px; margin:14px 0 4px; }
  .bar > div { height:100%; width:0; background:var(--accent); border-radius:2px; }
  .time { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
  .controls { display:flex; justify-content:center; gap:10px; margin-top:12px; }
  button { border:0; border-radius:10px; padding:10px 14px; font-size:15px; cursor:pointer;
           background:var(--bg); color:var(--fg); }
  button:hover { background:var(--accent); color:#fff; }
  #err { color:#e5484d; font-size:13px; margin-top:8px; min-height:1em; }
</style>
</head>
<body>
<div class="card">
  <select id="device"></select>
  <div class="now">
    <img id="img" alt="">
    <div><div class="title" id="title">—</div><div class="sub" id="sub"></div></div>
  </div>
  <div class="bar"><div id="fill"></div></div>
  <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="controls">
    <button data-a="seek" data-d="-30" title="Reculer de 30 s">⏪ 30</button>
    <button data-a="toggle" id="pp" title="Pause / lecture">⏯</button>
    <button data-a="seek" data-d="30" title="Avancer de 30 s">30 ⏩</button>
    <button data-a="stop" title="Arrêter la diffusion">⏹</button>
  </div>
  <div id="err"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s/3600),
  m = Math.floor(s%3600/60), x = String(s%60).padStart(2,"0");
  return h ? `${h}:${String(m).padStart(2,"0")}:${x}` : `${m}:${x}`; };
const dev = () => encodeURIComponent($("device").value);

async function api(path, opts) {
  const r = await fetch(path, opts); const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
async function loadDevices() {
  try {
    const list = await api("/api/devices");
    $("device").innerHTML = list.map(n => `<option>${n}</option>`).join("");
    $("err").textContent = list.length ? "" : "Aucun Chromecast trouvé";
  } catch (e) { $("err").textContent = e.message; }
}
async function refresh() {
  if (!$("device").value) return;
  try {
    const s = await api(`/api/status?device=${dev()}`);
    $("title").textContent = s.title || s.app || "Rien en cours de diffusion";
    $("sub").textContent = [s.artist, s.app, s.state].filter(Boolean).join(" · ");
    $("img").style.visibility = s.image ? "visible" : "hidden"; if (s.image) $("img").src = s.image;
    $("cur").textContent = fmt(s.current); $("dur").textContent = fmt(s.duration);
    $("fill").style.width = s.duration ? `${100 * s.current / s.duration}%` : "0";
    $("err").textContent = "";
  } catch (e) { $("err").textContent = e.message; }
}
document.querySelectorAll("button").forEach(b => b.onclick = async () => {
  try {
    await api(`/api/action?device=${dev()}&action=${b.dataset.a}&delta=${b.dataset.d || 0}`, {method:"POST"});
    setTimeout(refresh, 500);
  } catch (e) { $("err").textContent = e.message; }
});
loadDevices().then(refresh); setInterval(refresh, 2000);
</script>
</body>
</html>
